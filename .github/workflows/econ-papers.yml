name: Econ papers (qt3d-reel branch)

# ICAI's published CA Foundation Paper 4 (Business Economics) MCQ booklets with keys -> demo/icai_p4/ (text + page images).
on:
  push:
    branches: [qt3d-reel]
    paths: ["demo/icai_p4/request.txt"]

permissions:
  contents: write

jobs:
  papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        name: [Sep2024, Jan2025, May2025, Sep2025, Jan2026, May2026]
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Download, text and page images
        run: |
          cd demo/icai_p4
          name=${{ matrix.name }}
          url=$(awk -v n="$name" '$1==n{print $2}' request.txt)
          curl -sSfL -o "$name.pdf" "$url"
          pdfinfo "$name.pdf" | grep Pages
          pdftotext -layout "$name.pdf" "$name.txt"
          wc -c "$name.txt"
          mkdir -p "$name"
          pdftoppm -r 100 -gray -jpeg -jpegopt quality=70 "$name.pdf" "$name/p"
          rm -f "$name.pdf"
      - name: Save
        run: |
          git config user.name "mcq-agent"; git config user.email "mcq-agent@users.noreply.github.com"
          git add demo/icai_p4; git commit -q -m "ICAI Paper 4 booklet ${{ matrix.name }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin qt3d-reel && git push -q origin HEAD:qt3d-reel && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
