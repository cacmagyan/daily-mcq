name: 7. News of the day

# Makes tonight's news carousel (queue/DATE/news.json + news_*.jpg) from the feeds in config.yaml,
# about an hour before it posts (news.post_time, 22:00 IST). "4. Publish due MCQs" posts it.
on:
  schedule:
    - cron: "32 15 * * *"          # 21:02 IST
    - cron: "2 16 * * *"           # 21:32 IST  back-up run (does nothing if the news is already made)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code; fi

      - name: Make the news
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m mcq_agent news --date today

      - name: Save
        run: |
          git config user.name "mcq-agent"
          git config user.email "mcq-agent@users.noreply.github.com"
          DATE=$(TZ=Asia/Kolkata date +%F)
          git add "queue/$DATE/news.json" queue/$DATE/news_*.jpg 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "News for $DATE"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
