name: 7. Weekly report

# Every Sunday at about 9 PM: last week's Instagram numbers per kind of post, the best and weakest
# posts, follower growth and a few lines from Claude on what worked, as a GitHub issue (you are
# @mentioned, so GitHub notifies you). The numbers are kept in stats/. Run it by hand any time.
on:
  schedule:
    - cron: "43 15 * * 0"          # Sunday 21:13 IST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          pip install requests PyYAML Pillow Jinja2
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code; fi

      - name: Make the report
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m mcq_agent weekly-report --out "$RUNNER_TEMP/weekly.md"

      - name: Post it and keep the numbers
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git config user.name "mcq-agent"
          git config user.email "mcq-agent@users.noreply.github.com"
          git add stats
          if ! git diff --cached --quiet; then
            git commit -q -m "Weekly numbers $(TZ=Asia/Kolkata date +%F)"
            for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
          gh label create weekly-report --color 1F5FD1 --description "Weekly Instagram numbers" --force >/dev/null 2>&1 || true
          TITLE=$(head -1 "$RUNNER_TEMP/weekly.md" | sed 's/^## //')
          { cat "$RUNNER_TEMP/weekly.md"; echo; echo "@$OWNER"; } > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --label weekly-report --body-file "$RUNNER_TEMP/body.md"
