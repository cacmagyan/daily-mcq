name: 8. PYQ and countdown

# Makes tomorrow's PYQ slot (the CA Foundation QT trap reel: queue/DATE/pyq.json + pyq.mp4, or the
# older PYQ slides) and exam countdown Story
# (countdown.json + countdown.jpg). The early-morning run makes today's if the evening run missed it.
on:
  schedule:
    - cron: "47 16 * * *"          # 22:17 IST, for tomorrow
    - cron: "2 0 * * *"            # 05:32 IST, back-up for today
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD, today or tomorrow)"
        default: "tomorrow"

permissions:
  contents: write

concurrency:
  group: extras
  cancel-in-progress: false

jobs:
  extras:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          # ffmpeg makes the QT trap reel; espeak-ng gives its voice the pronunciation
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code; fi

      # the free voice (Kokoro, ~340 MB): the same cache the explainers use
      - name: Voice model cache
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-v1.0

      - name: Make the PYQ and the countdown
        id: make
        timeout-minutes: 50
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          DAY="${INPUT_DATE:-tomorrow}"
          if [ "$SCHEDULE" = "2 0 * * *" ]; then DAY=today; fi
          python -m mcq_agent extras --date "$DAY"
          echo "date=$(python -c "from mcq_agent.config import Config; print(Config().resolve_date('$DAY'))")" >> "$GITHUB_OUTPUT"

      - name: Save
        env:
          DATE: ${{ steps.make.outputs.date }}
        run: |
          git config user.name "mcq-agent"
          git config user.email "mcq-agent@users.noreply.github.com"
          for f in queue/$DATE/pyq.json queue/$DATE/countdown.json queue/$DATE/pyq_*.jpg queue/$DATE/pyq.mp4 queue/$DATE/countdown.jpg; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "PYQ and countdown for $DATE"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
