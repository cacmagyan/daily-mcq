name: Past papers (qt3d-reel branch)

# Downloads the PDFs listed in demo/papers/request.txt ("folder/name url" per line) and saves each as page
# images under demo/papers/folder/name/ for building trap-question banks.
on:
  push:
    branches: [qt3d-reel]
    paths: ["demo/papers/request.txt", "demo/papers/pages.txt"]

permissions:
  contents: write

jobs:
  papers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Download and page images
        run: |
          cd demo/papers
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            [ -d "$name" ] && continue
            mkdir -p "$name"
            if curl -sSfL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -o "$name.pdf" "$url"; then
              pdfinfo "$name.pdf" | grep Pages
              pdftoppm -r 110 -gray -jpeg -jpegopt quality=72 "$name.pdf" "$name/p"
              rm -f "$name.pdf"
            else
              echo "could not download $name"; rmdir "$name"
            fi
          done < request.txt
      - name: List the PDF links on the pages in pages.txt
        run: |
          cd demo/papers
          [ -f pages.txt ] || exit 0
          : > links.txt
          while read -r url; do
            [ -z "$url" ] && continue
            echo "== $url" >> links.txt
            curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "$url" \
              | grep -oiE 'href="[^"]+\.pdf"[^<]*<?[^<]{0,120}' | head -200 >> links.txt || echo "failed" >> links.txt
          done < pages.txt
      - name: Save
        run: |
          git config user.name "mcq-agent"; git config user.email "mcq-agent@users.noreply.github.com"
          git add demo/papers; git commit -q -m "Past papers: page images [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin qt3d-reel && git push -q origin HEAD:qt3d-reel && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
