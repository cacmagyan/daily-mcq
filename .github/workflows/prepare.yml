name: 1. Prepare tomorrow's MCQs

# Every evening: writes tomorrow's 6 MCQs and the concept of the day, and draws the images.
#   auto mode (config.yaml):  approves them itself and opens the day's report issue. Anything with a
#                             serious problem is held back and you're @mentioned the evening before.
#   github_pr mode:           opens a pull request; merging it approves the batch.
# If tomorrow's MCQs already exist, the evening run only adds a missing concept note.
on:
  schedule:
    - cron: "17 13 * * *"          # 18:47 IST
    # Back-up runs in case GitHub skips or delays the first one; they do nothing if tomorrow is ready.
    - cron: "47 14 * * *"          # 20:17 IST
    - cron: "17 16 * * *"          # 21:47 IST
  workflow_dispatch:
    inputs:
      date:
        description: "Batch date (YYYY-MM-DD). Leave blank for tomorrow."
        required: false
      sample:
        description: "Use the built-in sample MCQs (no Claude API needed)"
        type: boolean
        default: false
      redraw_only:
        description: "Only redraw an existing day (keeps its MCQs; needs the date)"
        type: boolean
        default: false
      concept_only:
        description: "Only add the concept note to a day that is already prepared (keeps its MCQs)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 100           # stronger checking makes more Claude calls
    steps:
      # the latest main, so a back-up run that waited in the queue sees what an earlier run made
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      # all = write the whole day; concept = only the concept note; none = nothing to do
      - name: What's needed?
        id: need
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_REDRAW: ${{ inputs.redraw_only }}
          INPUT_CONCEPT: ${{ inputs.concept_only }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            NEED=$(python -m mcq_agent todo --date tomorrow)
          elif [ "$INPUT_REDRAW" = "true" ]; then
            NEED=redraw
          elif [ "$INPUT_CONCEPT" = "true" ]; then
            [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Concept only needs the date, e.g. 2026-10-19"; exit 1; }
            NEED=concept
          else
            NEED=all
          fi
          echo "need=$NEED" >> "$GITHUB_OUTPUT"
          echo "mode=$(python -m mcq_agent mode)" >> "$GITHUB_OUTPUT"
          if [ "$NEED" = "none" ]; then echo "::notice::Tomorrow is already prepared, so there is nothing to do tonight."; fi

      - name: Install the drawing browser and Claude
        if: steps.need.outputs.need != 'none'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python -m playwright install --with-deps chromium
          # Claude Code is only needed when posts are written with your Claude subscription
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code; claude --version; fi

      - name: Write and draw
        id: prep
        if: steps.need.outputs.need != 'none'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SAMPLE: ${{ inputs.sample }}
          NEED: ${{ steps.need.outputs.need }}
        run: |
          if [ "$NEED" = "redraw" ]; then
            [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Redraw needs the date, e.g. 2026-10-20"; exit 1; }
            python -m mcq_agent render --date "$INPUT_DATE"
            echo "batch_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARGS=(--date "${INPUT_DATE:-tomorrow}")
          if [ "$INPUT_SAMPLE" = "true" ]; then ARGS+=(--sample); fi
          if [ "$NEED" = "concept" ]; then ARGS+=(--courses concept); fi
          python -m mcq_agent prepare "${ARGS[@]}" --github-output "$GITHUB_OUTPUT"

      # Sample MCQs never post by themselves: they always go to a pull request.
      - name: Approve automatically and post the day's report
        if: steps.need.outputs.need != 'none' && steps.need.outputs.mode == 'auto' && inputs.sample != true
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.prep.outputs.batch_date }}
        run: |
          git config user.name "mcq-agent"
          git config user.email "mcq-agent@users.noreply.github.com"
          git add "queue/$DATE"
          if ! git diff --cached --quiet; then
            git commit -m "MCQs for $DATE (approved automatically)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
          python -m mcq_agent report --date "$DATE" > "$RUNNER_TEMP/report.md"
          TITLE=$(python -m mcq_agent report-title --date "$DATE")
          gh label create mcq-day --color 0E8A16 --description "Daily MCQ report" --force >/dev/null 2>&1 || true
          NUM=$(gh issue list --label mcq-day --state open --search "\"MCQs for $DATE\" in:title" --json number -q '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "$TITLE" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "$TITLE" --label mcq-day --body-file "$RUNNER_TEMP/report.md"
          fi

      - name: Open the review pull request
        if: steps.need.outputs.need != 'none' && (steps.need.outputs.mode != 'auto' || inputs.sample == true)
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.prep.outputs.batch_date }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="batch/$DATE"
          git config user.name "mcq-agent"
          git config user.email "mcq-agent@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add "queue/$DATE"
          git commit -m "MCQs for $DATE"
          git push --force origin "$BRANCH"
          python -m mcq_agent pr-body --date "$DATE" --branch "$BRANCH" > "$RUNNER_TEMP/body.md"
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "MCQs for $DATE: review, then merge to approve" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
