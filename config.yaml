# ─────────────────────────────────────────────────────────────
#  Daily MCQ agent: settings
#  Change brand, colours, posting times and papers here.
#  No code changes are needed for any of these.
# ─────────────────────────────────────────────────────────────

brand:
  name: "Rahul kp"              # signature on every image
  handle: "@cacmagyan"          # your Instagram handle, e.g. "@rahulkp.cma" (shown on images + captions)
  start_date: "2026-10-19"      # Day 1 of the series. Images show "Day N" counted from here.
  paused: [["2026-10-24", "2026-10-26"]]   # days with no posts; Day N carries on after them (27 Oct = Day 6)
  logo: "assets/brand/logo.png" # shown top-right on every image; "" for none.
                                # Replace with: python -m mcq_agent set-logo path/to/logo.png

timezone: "Asia/Kolkata"

# Claude models used to write and double-check each MCQ.
models:
  writer: "claude-sonnet-5-5"   # writes the question, options, explanation
  checker: "claude-opus-5-5"    # solves each MCQ blind and re-checks each concept note; a stronger model
                                # than the writer catches more. If your plan can't use it, the writer model is used.
  max_attempts: 3               # rewrites allowed when the checker disagrees
  strong_checks: "law_tax_audit"  # "all" = the checker model solves every MCQ; "law_tax_audit" = only tax, law,
                                  # audit and SM papers (the others use the writer model; their arithmetic is
                                  # re-done by code). About half the Claude usage, so more days fit in your limit.

review:
  # auto:      MCQs post by themselves. Any MCQ with a serious problem (answer key not
  #            confirmed, text cut off) is put on hold and you're notified in a GitHub issue.
  # github_pr: the evening job opens a pull request; merging it approves the batch.
  # local:     run `python -m mcq_agent approve --date YYYY-MM-DD` yourself.
  mode: "auto"

# Who prepares each paper. A paper marked `author: ranjith` is signed "Ranjith Shivahari";
# every other paper is signed with `default`.
authors:
  default: "Rahul kp"
  ranjith: "Ranjith Shivahari"
  show_on_mcqs: true            # MCQ images also say who prepared them (false = always the brand name)

# Concept of the day: one 4-slide handwritten-notebook post a day (concept, formula,
# study trick, common mistakes), one course a day in this order. Tomorrow's MCQ for that
# course tests the concept.
concepts:
  enabled: true
  start_date: "2026-10-19"      # first concept post (normally written the evening before)
  post_time: "20:30"            # IST; keep matched to the 20:32 line in publish.yml
  courses: ["ca_foundation", "cma_cat", "ca_inter", "cma_inter", "ca_final", "cma_final"]
  # A second note (and its cartoon video) every day, for a course of the other family than the
  # evening note, so CA and CMA students both get a note and a video each day.
  second:
    enabled: true
    start_date: "2026-10-31"
    post_time: "13:00"          # IST, lunch break; keep matched to the 13:02 line in publish.yml

# Which MCQs post: with alternate on, the three CA courses one day and the three CMA courses the next.
mcqs:
  alternate: true
  start_date: "2026-10-31"      # the first family below posts on this date, the second the next day, ...
  families:
    - ["ca_foundation", "ca_inter", "ca_final"]
    - ["cma_cat", "cma_inter", "cma_final"]

# MCQ reel of the day: one of the day's MCQs as a 15-second vertical video (question with a
# countdown and ticking, then the answer filled in like an OMR bubble, with the reason).
# It reuses an MCQ that has already passed every check, one course a day in this order (set so the
# reel's course is never the concept note's course that day); if that MCQ is on hold, the next course is used.
reels:
  enabled: false                # off: the classroom explainer is the only reel (true = make the MCQ reel again, as its backup)
  start_date: "2026-10-20"      # first reel (normally made the evening before)
  post_time: "19:30"            # IST; the evening video slot. Keep matched to the 19:32 line in publish.yml
  courses: ["ca_final", "cma_final", "ca_foundation", "cma_cat", "ca_inter", "cma_inter"]
  think_seconds: 8              # countdown before the answer shows
  answer_seconds: 7             # how long the answer stays on screen
  trial: false                  # true = Trial Reel: shown first only to people who don't follow you
  audio_name: "MCQ countdown · CA CMA Gyan"   # name of the reel's sound on Instagram ("" = Instagram's default)
  # The paper's author presents the reel: his pictures (transparent PNG, waist-up) are
  # assets/brand/<name>-think.png (while the clock runs), <name>-point.png (pointing at the reason)
  # and <name>-thumbs.png (thumbs-up and "Follow" at the end). No pictures = no presenter; if the
  # text is too long to fit beside him, that reel is drawn without him.
  presenters:
    "Rahul kp": "rahul"
    "Ranjith Shivahari": "ranjith"
  # AI voiceover: the presenter says a hook, reads the answer and reason, and asks viewers to share.
  # Needs one voice key as a GitHub secret (README, "Reel voice"); without it reels have ticks only.
  voice:
    enabled: true
    provider: "auto"            # auto = Azure if AZURE_SPEECH_KEY is set, else Google if GOOGLE_TTS_API_KEY is set
    speed: 1.05                 # 1.0 = normal speaking speed
    voices:                     # Indian English voices, a different one for each presenter
      azure:  {"Rahul kp": "en-IN-PrabhatNeural", "Ranjith Shivahari": "en-IN-AaravNeural"}
      google: {"Rahul kp": "en-IN-Neural2-B", "Ranjith Shivahari": "en-IN-Neural2-C"}

# Cartoon explainer reel: a one-minute classroom scene on the day's concept of the day. The page's
# two students ask and react, the elephant teacher explains at a chalkboard (each with their own free
# Kokoro voice, no key needed). It takes the reel's 6 PM slot; the MCQ reel above is still made each
# day and posts only if the explainer can't (failed or held). Claude writes the scene from the checked
# concept note; a second call checks it.
explainer:
  enabled: true
  start_date: "2026-10-30"      # first explainer reel
  post_time: "19:30"            # evening video (keep matched to the 19:32 line in publish.yml)
  second_post_time: "08:30"     # the second note's video, morning (keep matched to the 08:32 line in publish.yml)
  style: "story"                # "story": classroom scene · "classic": the elephant alone, ~40 s
  voice: "af_heart"             # classic style only (the story's voices are in story_video.py)
  speed: 1.05                   # 1.0 = normal speaking speed
  music: true                   # soft plucked tune under the voices
  max_attempts: 3               # script rewrites if the format or the checker finds a problem

# Comment NOTES → DM: the explainer reel and the concept post ask students to comment NOTES; every
# 30 minutes the agent DMs each of them the day's full concept note as a PDF and replies "Sent! Check
# your DMs" under the comment. Needs two extra permissions on the Instagram token (README).
comment_dm:
  enabled: true
  keywords: ["notes", "note", "pdf"]   # a comment with any of these words gets the PDF (the first is shown in the call to action)
  posts: ["explainer", "concept", "explainer2", "concept2"]      # which posts it answers on
  days: 7                              # Instagram allows the DM up to 7 days after the comment
  public_reply: "Sent! Check your DMs 📩"

# Weekly report: every Sunday evening an issue with last week's numbers per kind of post (views,
# reach, saves, shares, watch time), the best and weakest posts, follower growth and a few lines from
# Claude on what worked (1 Claude call a week). Needs the insights permission on the token (README).
weekly_report:
  enabled: true
  summary: true

# Stories: right after each post goes out, a Story follows (Instagram's API can't add poll stickers
# or Highlights; add the week's Stories to the course Highlights in the app).
stories:
  enabled: true
  mcqs: true                    # the question, "Reply with A, B, C or D · Answer in today's post"
  concept: true                 # the concept note's first slide, pointing to the post
  reel: true                    # the reel itself, shared to the Story
  within_hours: 6               # a Story more than 6 hours late is skipped

instagram:
  graph_host: "graph.instagram.com"   # use "graph.facebook.com" if you connect through a Facebook Page
  api_version: "v26.0"
  # Where Instagram downloads the images from, tried in order.
  #   github_raw / jsdelivr : files in this GitHub repo (repo must be public)
  #   cloudinary            : needs CLOUDINARY_URL secret (use this for a private repo)
  #   base_url              : any static host you run; set public_base_url
  image_hosts: ["github_raw", "jsdelivr"]
  public_base_url: ""
  max_posts_per_run: 2          # catch-up limit if a run was missed
  max_hashtags: 5               # Instagram allows at most 5 hashtags per post
  alt_text: true

# Which law each tax paper follows. The date picks the entry, so tax questions
# switch to the Income-tax Act, 2025 on their own when the May 2027 attempt nears.
# Update the CMA entry when ICMAI publishes the applicability notice for each term.
law_basis:
  ca_income_tax:
    - until: "2027-01-31"
      text: "Income-tax Act, 1961 as applicable for A.Y. 2026-27 (CA exams up to January 2027)"
    - from: "2027-02-01"
      text: "Income-tax Act, 2025 for tax year 2026-27 (CA exams from May 2027)"
  ca_gst:
    - text: "CGST/IGST law as per ICAI's applicability announcement for the next attempt"
  cma_tax:
    - text: "Finance Act, 2025 and GST as per ICMAI's applicability notice for the next term (June 2026 term: amendments up to 30 Nov 2025)"
  statutory:
    - text: "Current provisions as per ICMAI CAT study material; avoid recently changed rates and limits"

# ─────────────────────────────────────────────────────────────
