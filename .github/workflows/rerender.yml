name: 2. Redraw images after an edit

# When you edit queue/<date>/mcqs.json in a review pull request, the images are redrawn.
on:
  push:
    branches: ["batch/**"]
    paths: ["queue/**/mcqs.json"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rerender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redraw:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Redraw and update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          DATE="${BRANCH#batch/}"
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Not a batch branch"; exit 1; }
          python -m mcq_agent render --date "$DATE"
          git config user.name "mcq-agent"
          git config user.email "mcq-agent@users.noreply.github.com"
          git add "queue/$DATE"
          if git diff --cached --quiet; then echo "Images already up to date"; exit 0; fi
          git commit -m "Redraw images for $DATE"
          git push
          python -m mcq_agent pr-body --date "$DATE" --branch "$BRANCH" > "$RUNNER_TEMP/body.md"
          gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md" || true
