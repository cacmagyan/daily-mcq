name: 4. Publish due MCQs

# One run per post slot (6 MCQs + the concept of the day). Each run posts every approved post whose time (config.yaml)
# has passed and that isn't posted yet, so a delayed or missed run catches up.
# GitHub cron is UTC: IST = UTC + 5:30. Runs start a couple of minutes after each post_time.
on:
  schedule:
    - cron: "27 2 * * *"           # 07:57 IST  CA Foundation  (post_time 07:55)
    - cron: "27 4 * * *"           # 09:57 IST  CMA CAT        (09:55)
    - cron: "57 6 * * *"           # 12:27 IST  CA Inter       (12:25)
    - cron: "57 9 * * *"           # 15:27 IST  CMA Inter      (15:25)
    - cron: "57 12 * * *"          # 18:27 IST  CA Final       (18:25)
    - cron: "12 14 * * *"          # 19:42 IST  Concept of the day (concepts post_time 19:40)
    - cron: "27 15 * * *"          # 20:57 IST  CMA Final      (20:55)
    # Back-up runs every 30 minutes, 07:37 to 22:07 IST. GitHub sometimes starts a timed run late or
    # skips it; the next back-up run then posts whatever is due. Nothing is ever posted twice.
    - cron: "7,37 2-16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be posted"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # the latest main, so a run that waited in the queue sees posts made in the meantime
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Post to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          # The morning run fails loudly (GitHub emails you) if today's batch was never approved.
          FIRST_SLOT: ${{ github.event.schedule == '27 2 * * *' }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$FIRST_SLOT" = "true" ]; then ARGS+=(--strict); fi
          python -m mcq_agent publish "${ARGS[@]}"

      - name: Record what was posted
        if: always()
        run: |
          git config user.name "mcq-agent"
          git config user.email "mcq-agent@users.noreply.github.com"
          # keep a copy of this run's records, then add them to the newest main (another run may have
          # recorded posts at the same time; both sets are kept)
          SAVED="$RUNNER_TEMP/posted"
          mkdir -p "$SAVED"
          for f in queue/*/posted.json; do
            [ -f "$f" ] || continue
            mkdir -p "$SAVED/$(dirname "$f")" && cp "$f" "$SAVED/$f"
          done
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python -m mcq_agent merge-posted "$SAVED"
            git add queue/*/posted.json 2>/dev/null || true
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "Posted MCQs $(TZ=Asia/Kolkata date +%F_%H%M)"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      # Ticks off what was posted in the day's report issue, and closes it after the last post.
      - name: Update the day's report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_SLOT: ${{ github.event.schedule == '27 15 * * *' }}
        run: |
          DATE=$(TZ=Asia/Kolkata date +%F)
          [ -f "queue/$DATE/mcqs.json" ] || exit 0
          NUM=$(gh issue list --label mcq-day --state open --search "\"MCQs for $DATE\" in:title" --json number -q '.[0].number' || true)
          [ -n "$NUM" ] || exit 0
          python -m mcq_agent report --date "$DATE" > "$RUNNER_TEMP/report.md"
          gh issue edit "$NUM" --title "$(python -m mcq_agent report-title --date "$DATE")" --body-file "$RUNNER_TEMP/report.md"
          if [ "$LAST_SLOT" = "true" ]; then
            gh issue close "$NUM" --comment "Day finished. Final status is in the report above."
          fi
