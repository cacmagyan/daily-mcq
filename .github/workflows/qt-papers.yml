name: QT papers (qt3d-reel branch)

# ICAI's published CA Foundation Paper 3 MCQ booklets (demo/icai/request.txt) -> demo/icai/ (text + page images).
on:
  push:
    branches: [qt3d-reel]
    paths: ["demo/icai/request.txt"]

permissions:
  contents: write

jobs:
  papers:
    # one job per booklet, in parallel; each saves its own text and page images as soon as it is done
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        name: [Jan2025, May2025, Sep2025, Jan2026, May2026]
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Download and page images (no OCR; the pages are read as images)
        run: |
          cd demo/icai
          name=${{ matrix.name }}
          url=$(awk -v n="$name" '$1==n{print $2}' request.txt)
          curl -sSfL -o "$name.pdf" "$url"
          mkdir -p "$name"
          pdftoppm -r 110 -gray -jpeg -jpegopt quality=72 "$name.pdf" "$name/p"
          pdfinfo "$name.pdf" | grep Pages
          rm -f "$name.pdf"
      - name: Save
        run: |
          git config user.name "mcq-agent"; git config user.email "mcq-agent@users.noreply.github.com"
          git add demo/icai; git commit -q -m "ICAI Paper 3 booklet ${{ matrix.name }}: text and page images" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin qt3d-reel && git push -q origin HEAD:qt3d-reel && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
