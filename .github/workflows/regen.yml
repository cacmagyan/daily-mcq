name: 3. Fix an MCQ (/regen, /approve, /hold)

# Comment on a day's report issue (or a review pull request):
#   /hold ca_inter                            stop it from posting
#   /approve ca_inter                         post a held MCQ as it is
#   /regen ca_inter                           replace it with a new MCQ (posts by itself if the check passes)
#   /regen cma_final make it a numerical on WACC
#   /regen reel                               make the MCQ reel again (/hold reel, /approve reel work too)
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  command:
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/regen') ||
       startsWith(github.event.comment.body, '/approve') ||
       startsWith(github.event.comment.body, '/hold')) &&
      (github.event.issue.pull_request || contains(github.event.issue.title, 'MCQs for '))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    concurrency:
      group: command-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
      TITLE: ${{ github.event.issue.title }}
      IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
    steps:
      - name: Find the day
        id: target
        run: |
          if [ "$IS_PR" = "true" ]; then
            BRANCH=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
            DATE="${BRANCH#batch/}"
          else
            BRANCH=main
            DATE=$(printf '%s' "$TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n 1)
          fi
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::No date in this issue or pull request"; exit 1; }
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          pip install -r requirements.txt
          # drawing and Claude are only needed for /regen
          if [[ "$COMMENT" == /regen* ]]; then
            python -m playwright install --with-deps chromium
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
            if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code; fi
          fi

      - name: Run the command
        id: cmd
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          COMMENT: ${{ github.event.comment.body }}
          DATE: ${{ steps.target.outputs.date }}
        run: python -m mcq_agent command --date "$DATE" --comment "$COMMENT" --github-output "$GITHUB_OUTPUT"

      - name: Save and report back
        env:
          DATE: ${{ steps.target.outputs.date }}
          BRANCH: ${{ steps.target.outputs.branch }}
          SUMMARY: ${{ steps.cmd.outputs.summary }}
          ACTION: ${{ steps.cmd.outputs.action }}
          COURSE: ${{ steps.cmd.outputs.course }}
        run: |
          git config user.name "mcq-agent"
          git config user.email "mcq-agent@users.noreply.github.com"
          git add "queue/$DATE"
          if ! git diff --cached --quiet; then
            git commit -m "/$ACTION $COURSE for $DATE"
            for i in 1 2 3; do git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break; sleep 5; done
          fi
          if [ "$IS_PR" = "true" ]; then
            python -m mcq_agent pr-body --date "$DATE" --branch "$BRANCH" > "$RUNNER_TEMP/body.md"
            gh pr edit "$NUMBER" --body-file "$RUNNER_TEMP/body.md"
          else
            python -m mcq_agent report --date "$DATE" > "$RUNNER_TEMP/body.md"
            gh issue edit "$NUMBER" --title "$(python -m mcq_agent report-title --date "$DATE")" --body-file "$RUNNER_TEMP/body.md"
          fi
          printf '✅ %s\n\nThe report above is updated.' "$SUMMARY" > "$RUNNER_TEMP/reply.md"
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/reply.md"

      - name: Report a failure
        if: failure()
        run: |
          gh issue comment "$NUMBER" --body "❌ Couldn't do that; open the Actions tab for the log. Write it as \`/regen <course> [instruction]\`, \`/approve <course>\` or \`/hold <course>\`."
