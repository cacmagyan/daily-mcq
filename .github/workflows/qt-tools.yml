name: QT tools (qt3d-reel branch)

# Branch-only helpers for the QT reel work:
#  - voice: one Azure line -> demo/voice/ (status + a short sample), to check the key and hear the voice
#  - papers: ICAI's published CA Foundation Paper 3 MCQ booklets -> demo/icai/ (text + page images)
on:
  push:
    branches: [qt3d-reel]
    paths: ["demo/voice/request.txt", "demo/icai/request.txt", ".github/workflows/qt-tools.yml"]

permissions:
  contents: write

jobs:
  voice:
    if: contains(join(github.event.commits.*.modified, ' '), 'demo/voice/request.txt') || contains(join(github.event.commits.*.added, ' '), 'demo/voice/request.txt')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests numpy
      - name: Speak one line
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          mkdir -p demo/voice
          python - <<'PY'
          import json, os, requests
          from pathlib import Path
          key = os.environ.get("AZURE_SPEECH_KEY", "").strip()
          region = os.environ.get("AZURE_SPEECH_REGION", "").strip()
          out = {"region": region, "key_length": len(key), "key_is_hex": all(c in "0123456789abcdefABCDEF" for c in key)}
          # token check: tells a bad key (401) apart from a voice/endpoint problem
          t = requests.post(f"https://{region}.api.cognitive.microsoft.com/sts/v1.0/issueToken",
                            headers={"Ocp-Apim-Subscription-Key": key, "Content-Length": "0"}, timeout=30)
          out["token_status"] = t.status_code
          lines = Path("demo/voice/request.txt").read_text().strip().splitlines()
          for i, ln in enumerate(lines):
              voice, rate, text = ln.split("|", 2)
              ssml = (f"<speak version='1.0' xml:lang='en-IN'><voice name='{voice}'><prosody rate='{rate}'>{text}"
                      "</prosody></voice></speak>")
              r = requests.post(f"https://{region}.tts.speech.microsoft.com/cognitiveservices/v1", data=ssml.encode(),
                                headers={"Ocp-Apim-Subscription-Key": key, "Content-Type": "application/ssml+xml",
                                         "X-Microsoft-OutputFormat": "audio-48khz-192kbitrate-mono-mp3",
                                         "User-Agent": "mcq-agent"}, timeout=60)
              out[f"tts_{i}"] = [voice, r.status_code, len(r.content)]
              if r.status_code == 200:
                  Path(f"demo/voice/sample_{i}_{voice}.mp3").write_bytes(r.content)
          Path("demo/voice/result.json").write_text(json.dumps(out, indent=1))
          print(out)
          PY
      - name: Save
        run: |
          git config user.name "mcq-agent"; git config user.email "mcq-agent@users.noreply.github.com"
          git add demo/voice; git commit -q -m "Voice check" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin qt3d-reel && git push -q origin HEAD:qt3d-reel && exit 0; sleep 5; done; exit 1

  papers:
    # one job per booklet, in parallel; each saves its own text and page images as soon as it is done
    if: contains(join(github.event.commits.*.modified, ' '), 'demo/icai/request.txt') || contains(join(github.event.commits.*.added, ' '), 'demo/icai/request.txt')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: [Sep2024, Jan2025, May2025, Sep2025, Jan2026, May2026]
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr parallel >/dev/null
      - name: Download, text (OCR for scanned pages), page images
        run: |
          cd demo/icai
          name=${{ matrix.name }}
          url=$(awk -v n="$name" '$1==n{print $2}' request.txt)
          curl -sSfL -o "$name.pdf" "$url"
          mkdir -p "$name" /tmp/pg
          n=$(pdfinfo "$name.pdf" | awk '/^Pages:/{print $2}')
          ocr() {  # one page -> /tmp/pg/NNN.txt
            p=$1; f=$2
            t=$(pdftotext -layout -f "$p" -l "$p" "$f" - | tr -d '\f')
            if [ "$(printf '%s' "$t" | tr -cd '[:alnum:]' | wc -c)" -lt 200 ]; then
              pdftoppm -r 200 -gray -f "$p" -l "$p" -png "$f" "/tmp/pg/img$p"
              t=$(tesseract "$(ls /tmp/pg/img$p*.png | head -1)" - --psm 6 2>/dev/null); src=ocr
            else src=text; fi
            printf '\n===== page %s (%s) =====\n%s\n' "$p" "$src" "$t" > "/tmp/pg/$(printf %03d "$p").txt"
          }
          export -f ocr
          seq 1 "$n" | parallel -j 4 ocr {} "$name.pdf"
          cat /tmp/pg/*.txt > "$name.txt"
          pdftoppm -r 110 -gray -jpeg -jpegopt quality=72 "$name.pdf" "$name/p"
          rm -f "$name.pdf"
          du -sh .
      - name: Save
        run: |
          git config user.name "mcq-agent"; git config user.email "mcq-agent@users.noreply.github.com"
          git add demo/icai; git commit -q -m "ICAI Paper 3 booklet ${{ matrix.name }}: text and page images" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin qt3d-reel && git push -q origin HEAD:qt3d-reel && exit 0; sleep $((RANDOM % 10 + 3)); done; exit 1
